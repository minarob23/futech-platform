<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1f32"/>
      <stop offset="100%" stop-color="#06101c"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonCyan" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55e7ff"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Background Icon Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#1f4469" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Glowing Code Bracket Left < -->
  <path d="M190 170L100 256L190 342" stroke="url(#neonCyan)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glowing Code Bracket Right > -->
  <path d="M322 170L412 256L322 342" stroke="url(#neonCyan)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Stylized Cyber 'F' Monogram in Center -->
  <path d="M226 130H326M226 130V382M226 130H300M226 250H290" stroke="url(#neonCyan)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Modern Diagonal Cyber Accent on F -->
  <path d="M280 250L240 370" stroke="url(#neonCyan)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Tech Pulse Point -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow)"/>
</svg>
